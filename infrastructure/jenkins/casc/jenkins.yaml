# Jenkins Configuration as Code. Applied at every start: UI changes to these settings are overwritten.
# Secrets are resolved from files in /run/secrets (Compose secrets), never from this file.
jenkins:
  systemMessage: "Agentic DevOps lab - configuration managed by JCasC"
  # No builds on the controller: executors come from isolated agents (Phase 3).
  numExecutors: 0
  mode: EXCLUSIVE
  # Inbound TCP agent port disabled until an isolated agent design is in place.
  slaveAgentPort: -1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Jenkins Admin"
          password: "${jenkins_admin_password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  # CSRF protection (crumb issuer) is always on in this Jenkins version; nothing to configure.
  markupFormatter: plainText
  nodes:
    # Isolated build agent (compose service jenkins-agent): JDK 21, Maven wrapper, buildctl over mTLS.
    - permanent:
        name: "build-agent-1"
        labelString: "build linux"
        numExecutors: 2
        mode: EXCLUSIVE
        remoteFS: "/home/jenkins/agent"
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15
            # The agent's ed25519 host key is pinned (no trust-on-first-use).
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                key: "${readFile:/run/secrets/jenkins_agent_host_key.pub}"
credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "jenkins-agent-ssh"
              username: "jenkins"
              description: "Controller -> build agent SSH key"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/jenkins_agent_ssh_key}"
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "SonarQube global analysis token"
              secret: "${readFile:/run/secrets/sonarqube_jenkins_token}"
          - gitHubApp:
              id: "github-app"
              description: "GitHub App (repo checkout + PR status checks)"
              appID: "${GITHUB_APP_ID}"
              owner: "${GITHUB_OWNER}"
              privateKey: "${readFile:/run/secrets/github_app_key.pem}"
unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL:-http://localhost:8080/}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonarqube-token"
jobs:
  # Multibranch job: discovers main and pull requests by polling GitHub every 2 minutes
  # (no inbound webhook exposure). Fork PRs are not built.
  - script: |
      multibranchPipelineJob('demo-app') {
        branchSources {
          branchSource {
            source {
              github {
                id('demo-app-github')
                repoOwner('${GITHUB_OWNER}')
                repository('${GITHUB_DEMO_REPO}')
                repositoryUrl('https://github.com/${GITHUB_OWNER}/${GITHUB_DEMO_REPO}')
                configuredByUrl(false)
                credentialsId('github-app')
                traits {
                  gitHubBranchDiscovery { strategyId(1) }
                  gitHubPullRequestDiscovery { strategyId(1) }
                }
              }
            }
          }
        }
        triggers { periodicFolderTrigger { interval('2m') } }
        orphanedItemStrategy { discardOldItems { numToKeep(10) } }
      }
